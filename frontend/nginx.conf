server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Default nginx limit is 1MB, which would silently reject any real
    # forensic dataset upload (POST /api/dataset/upload). 200MB is generous
    # for CSV exports; raise further if your datasets are larger.
    client_max_body_size 200M;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 300s;   # large uploads trigger a synchronous pipeline
                                   # validation pass before the background job starts
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
